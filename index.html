<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <title>Dr. Choong-Soo Lee @ SLU | About</title>
  <link rel="stylesheet" href="assets/css/main.css" />
</head>
<body>

  <header id="site-header"></header>

  <main>
    <section>
      <h2>About</h2>
      <div class="profile-grid">
        <div>
          <h1 id="prof-name" class="profile-name">Loading...</h1>
          <p id="prof-title" class="profile-title"></p>
          <div id="prof-bio"></div>
        </div>
        <div id="photo-container"></div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
  <script src="assets/js/main.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const data = await loadSiteData("nav-about");
      if (!data || !data.profile) return;
      const p = data.profile;
      document.getElementById("prof-name").innerText = p.name;
      document.getElementById("prof-title").innerText = `${p.title} — ${p.institution}`;
      document.getElementById("prof-bio").innerHTML = parseMarkdown(p.bio);
      if (p.photo) {
        document.getElementById("photo-container").innerHTML = `<img src="${p.photo}" alt="${p.name}" class="profile-img">`;
      }
    });
  </script>
</body>
</html>
