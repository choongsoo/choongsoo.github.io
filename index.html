<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <title>Dr. Choong-Soo Lee @ SLU | About</title>
  <link rel="stylesheet" href="assets/css/main.css" />
  <style>
    .profile-grid { display: grid; grid-template-columns: 1fr 220px; gap: 2rem; align-items: start; }
    .profile-img { width: 100%; height: auto; border-radius: 8px; border: 1px solid var(--border); }
    @media (max-width: 600px) { .profile-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <header id="site-header"></header>

  <main>
    <section>
      <h2>About</h2>
      <div class="profile-grid">
        <div>
          <h1 id="prof-name" style="color: var(--text-dark); font-size: 2rem;">Loading...</h1>
          <p id="prof-title" style="color: var(--accent); font-weight: 600; margin-bottom: 1rem;"></p>
          <p id="prof-bio"></p>
        </div>
        <div id="photo-container"></div>
      </div>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <script src="assets/js/main.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const data = await loadSiteData("nav-about");
      if (!data) return;
      const p = data.profile;
      document.getElementById("prof-name").innerText = p.name;
      document.getElementById("prof-title").innerText = `${p.title} — ${p.institution}`;
      document.getElementById("prof-bio").innerText = p.bio;
      if (p.photo) {
        document.getElementById("photo-container").innerHTML = `<img src="${p.photo}" alt="${p.name}" class="profile-img">`;
      }
    });
  </script>
</body>
</html>
